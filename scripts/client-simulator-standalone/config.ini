[auth]
; WoW 认证服务器配置
; account: 游戏账号
; password: 账号密码
; host: Auth 服务器地址
; port: Auth 服务器端口 (默认 3724)
; character: 角色名 (可选，留空选第一个角色)
; bot_target: Bot 目标玩家 (可选，Bot 模式)
; action: login / list / test (login=完整登录, list=仅获取角色列表, test=仅测试认证)

